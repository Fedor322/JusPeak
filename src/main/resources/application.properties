spring.application.name=JustSpeak

# Problem Details RFC 7807
spring.mvc.problemdetails.enabled=true

# PostgreSQL DataSource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:justspeak}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# MongoDB Reactive Configuration
spring.data.mongodb.uri=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:justspeak_comments}?authSource=admin
spring.data.mongodb.auto-index-creation=true

# Security & JWT Configuration
application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=ru.justspeak.controller
springdoc.override-with-generic-response=false
