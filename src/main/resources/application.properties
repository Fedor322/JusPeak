spring.application.name=JustSpeak

# Problem Details RFC 7807
spring.mvc.problemdetails.enabled=true

# PostgreSQL DataSource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:justspeak}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:supersecret_pass123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# MongoDB Reactive Configuration
spring.data.mongodb.uri=mongodb://${MONGO_USER:admin}:${MONGO_PASSWORD:supersecret_pass123}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:justspeak_comments}?authSource=admin
spring.data.mongodb.auto-index-creation=true

# Security & JWT Configuration
application.security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=ru.justspeak.controller
springdoc.override-with-generic-response=false
