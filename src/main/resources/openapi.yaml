openapi: 3.0.3
info:
  title: JustSpeak API
  version: 1.0.0
  description: API для платформы блогов с авторизацией, PostgreSQL и MongoDB.
servers:
  - url: http://localhost:8080
    description: Local server
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserRegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 50
          pattern: '^[a-zA-Z0-9_]+$'
          example: "JohnS"
        email:
          type: string
          format: email
          example: "John@example.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "12345678"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Sina"
      required:
        - username
        - email
        - password
    UserLoginRequest:
      type: object
      properties:
        username:
          type: string
          example: "JohnS"
        password:
          type: string
          example: "112345678"
      required:
        - username
        - password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        userId:
          type: integer
          format: int64
        username:
          type: string
        roles:
          type: array
          items:
            type: string
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          example: "JohnS"
        email:
          type: string
          format: email
          example: "John@example.com"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Sina"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        roles:
          type: array
          items:
            type: string
    UpdateProfileRequest:
      type: object
      properties:
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Sina"
        displayName:
          type: string
          example: "SinaDestroyer"
        biography:
          type: string
          example: "Hello, I am John Sina from USA"
        avatarUrl:
          type: string
          example: "https://example.com/avatar.jpg"
        profilePhotos:
          type: array
          items:
            type: string
            example: "https://example.com/photo1.jpg"
        profileUrl:
          type: string
          example: "https://example.com/sina"





    ProfileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Sina"
        displayName:
          type: string
          example: "SinaDestroyer"
        biography:
          type: string
          example: "Hello i am John Sina from USA"
        avatarUrl:
          type: string
          example: "sdsd"
        profilePhotos:
          type: array
          items:
            type: string
        profileUrl:
          type: string
          example: "https://mysite.com/john"
    PostCreateRequest:
      type: object
      properties:
        title:
          type: string
          example: "Day of my life"
        content:
          type: string
          example: "Today, leg day"
        published:
          type: boolean
      required:
        - title
        - content
        - published
    PostUpdateRequest:
      type: object
      properties:
        title:
          type: string
          example: "Day of my life"
        content:
          type: string
          example: "Today, leg day"
        published:
          type: boolean

    PostResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        title:
          type: string
          example: "Day of my life"
        content:
          type: string
          example: "Today, leg day"
        published:
          type: boolean
        views:
          type: integer
        commentsCount:
            type: integer
        createdAt:
          type: string
    CommentCreateRequest:
      type: object
      properties:
        content:
          type: string
        parentCommentId:
          type: string
      required:
        - content
    CommentResponse:
      type: object
      properties:
        id:
          type: string
        postId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        authorUsername:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        parentCommentId:
          type: string


paths:
  /api/auth/register:
    post:
      security: []
      summary: Регистрация нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  userId:
                    type: integer
                    format: int64
  /api/auth/login:
    post:
      security: []
      summary: Аутентификация пользователя и получение JWT токена
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/users/{userId}:
    get:
      summary: Получение информации о пользователе по ID
      parameters:
        - in: path
          name: userId
          schema:
            type: integer
            format: int64
          required: true
          description: ID пользователя
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
        - bearerAuth: []
  /api/users/{userId}/profile:
    get:
      summary: Получение информации о профиле по userId
      parameters:
        - in: path
          name: userId
          schema:
            type: integer
            format: int64
          required: true
          description: ID пользователя
      responses:
        '200':
          description: Profile information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
      security:
        - bearerAuth: [ ]

  /api/profiles/{profileId}:
    get:
      summary: Получение профиля по profileId
      parameters:
        - in: path
          name: profileId
          schema:
            type: integer
            format: int64
          required: true
      responses:
        '200':
          description: Profile information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
    put:
      summary: Обновление профиля пользователя
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: profileId
          schema:
            type: integer
            format: int64
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'

  /api/posts:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
      responses:
        '201':
          description: Post Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  postId:
                    type: integer
                    format: int64
                  userId:
                    type: integer
                    format: int64
                  title:
                    type: string
      security:
        - bearerAuth: []
    get:

      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - in: query
          name: sortBy
          schema:
            type: string
            default: createdAt
        - in: query
          name: direction
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - in: query
          name: published
          schema:
            type: boolean

      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostResponse'
                  totalPages:
                    type: integer
                  totalElements:
                    type: integer
  /api/posts/{postId}:
    get:
      parameters:
        - in: path
          name: postId
          schema:
            type: integer
            format: int64
          required: true
          description: ID поста
      responses:
        '200':
          description: Post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
    put:
      parameters:
        - in: path
          name: postId
          schema:
            type: integer
            format: int64
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdateRequest'
      responses:
        '200':
          description: Post updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  title:
                    type: string
      security:
        - bearerAuth: [ ]
    delete:
      parameters:
        - in: path
          name: postId
          schema:
            type: integer
            format: int64
          required: true
      responses:
        '204':
          description: Post deleted
      security:
        - bearerAuth: []
  /api/posts/{postId}/comments:
    post: 
        parameters:
          - in: path
            name: postId
            schema:
              type: integer
              format: int64
            required: true
            description: ID поста
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentCreateRequest'
        responses:
          '201':
            description: Comment added
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    id:
                      type: string
                      format: int64
                    postId:
                      type: integer
                      format: int64
                    userId:
                      type: integer
                      format: int64
                    createdAt:
                      type: string
                      format: date-time
        security:
          - bearerAuth: [ ]
    get:
      parameters:
        - in: path
          name: postId
          schema:
            type: integer
            format: int64
          required: true
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - in: query
          name: sortBy
          schema:
            type: string
            default: createdAt
        - in: query
          name: direction
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommentResponse'
                  totalPages:
                    type: integer
                  totalElements:
                    type: integer